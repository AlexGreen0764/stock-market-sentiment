[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-sentiment-prep"
version = "0.1.0"
description = "Prepare stock prices, news, and local SLM sentiment for Power BI"
readme = "README.md"
requires-python = ">=3.11"
# Install the CUDA-enabled torch wheel using the README command; dependency
# metadata alone cannot select a platform-specific PyTorch wheel index.
# Qwen3.5 text-model loading is validated with this Transformers release.
dependencies = ["pyarrow>=16", "torch>=2.5", "transformers>=5.22.1,<6"]

[tool.setuptools.packages.find]
include = ["stock_market_sentiment*"]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
