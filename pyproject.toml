[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-sentiment-prep"
version = "0.1.0"
description = "Prepare stock prices and news for visualization"
requires-python = ">=3.10"
dependencies = ["pyarrow>=16"]

[tool.setuptools.packages.find]
include = ["stock_market_sentiment*"]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
